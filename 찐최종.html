<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>카페 시재 마감현황판</title>
  <script>
    if (!window.opener && window.innerWidth > 720) {
      var popup = window.open(window.location.href, 'CafePOSWindowLarge', 'width=640,height=840,left=150,top=30,menubar=no,toolbar=no,location=no,status=no,resizable=yes');
      if (popup) { window.open('', '_self', ''); window.close(); }
    }
  </script>
  <style>
    * { box-sizing: border-box; font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; }
    html, body { margin: 0; padding: 0; background-color: #ffffff; }
    .container { width: 100%; max-width: 620px; margin: 0 auto; padding: 18px 24px; background: #ffffff; }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #333; padding-bottom: 12px; margin-bottom: 14px; }
    .header h1 { margin: 0; font-size: 24px; color: #222; }
    .btn-group { display: flex; gap: 6px; }
    .btn-header { padding: 7px 14px; font-size: 14px; font-weight: bold; border: none; border-radius: 6px; background-color: #e9ecef; color: #333; cursor: pointer; }
    .btn-header:hover { background-color: #dee2e6; }
    .info-box { display: flex; justify-content: space-between; align-items: center; background-color: #f8f9fa; padding: 10px 16px; border-radius: 8px; margin-bottom: 14px; font-size: 16px; }
    .info-item { display: flex; align-items: center; gap: 8px; }
    .info-item label { font-weight: bold; color: #555; }
    .info-item select { border: 1px solid #ced4da; border-radius: 5px; background-color: #ffffff; font-size: 16px; font-weight: bold; color: #222; padding: 4px 10px; min-width: 125px; outline: none; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 14px; }
    th, td { border: 1px solid #dee2e6; padding: 8px 12px; text-align: center; font-size: 17px; }
    th { background-color: #f1f3f5; color: #333; font-weight: bold; }
    td.unit-name { font-weight: bold; text-align: left; padding-left: 20px; }
    td input { width: 100px; padding: 5px 10px; font-size: 17px; text-align: right; border: 1px solid #ced4da; border-radius: 5px; }
    td.subtotal { text-align: right; padding-right: 20px; font-weight: 500; }
    tr.total-row { background-color: #eef4f8; font-weight: bold; font-size: 20px; }
    tr.total-row td { color: #1a365d; padding: 12px; }
    .extra-section { border: 1px solid #dee2e6; border-radius: 8px; padding: 12px 20px; background-color: #fcfcfc; }
    .extra-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .extra-row:last-child { margin-bottom: 0; }
    .extra-row label { font-weight: bold; font-size: 18px; color: #333; }
    .input-wrap { display: flex; align-items: center; gap: 8px; font-size: 18px; }
    .input-wrap input { width: 170px; padding: 6px 10px; font-size: 18px; text-align: right; border: 1px solid #ced4da; border-radius: 5px; }
    .modal-bg { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.45); justify-content: center; align-items: center; z-index: 100; }
    .modal-box { background: #ffffff; width: 340px; border-radius: 10px; padding: 20px; box-shadow: 0 4px 16px rgba(0,0,0,0.2); }
    .modal-title { margin: 0 0 14px 0; font-size: 18px; color: #222; border-bottom: 1px solid #eee; padding-bottom: 10px; }
    .add-row { display: flex; gap: 6px; margin-bottom: 14px; }
    .add-row input { flex: 1; padding: 7px 10px; font-size: 15px; border: 1px solid #ced4da; border-radius: 5px; outline: none; }
    .add-row button { padding: 7px 14px; font-size: 14px; font-weight: bold; border: none; border-radius: 5px; background-color: #2b5876; color: #fff; cursor: pointer; }
    .manage-list { max-height: 200px; overflow-y: auto; border: 1px solid #eee; border-radius: 6px; padding: 6px 10px; margin-bottom: 14px; }
    .manage-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 4px; border-bottom: 1px solid #f1f3f5; font-size: 15px; }
    .manage-item:last-child { border-bottom: none; }
    .btn-del-item { padding: 3px 8px; font-size: 12px; border: none; border-radius: 4px; background-color: #ffe3e3; color: #c92a2a; font-weight: bold; cursor: pointer; }
    .modal-close { width: 100%; padding: 8px; font-size: 15px; font-weight: bold; border: none; border-radius: 6px; background-color: #e9ecef; color: #333; cursor: pointer; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>☕ 카페 시재 마감현황판</h1>
    <div class="btn-group">
      <button type="button" class="btn-header" onclick="resetForm()">초기화</button>
      <button type="button" class="btn-header" onclick="openStaffModal()">수정</button>
    </div>
  </div>

  <div class="info-box">
    <div class="info-item">
      <label>마감 일자:</label>
      <span id="current-date" style="font-weight: bold; color: #222;"></span>
    </div>
    <div class="info-item">
      <label for="manager">담당자:</label>
      <select id="manager" class="nav-input"></select>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th style="width: 34%;">권종</th>
        <th style="width: 30%;">수량 (장/개)</th>
        <th style="width: 36%;">금액</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="unit-name">50,000원</td><td><input type="number" min="0" class="qty nav-input" data-unit="50000" placeholder="0" oninput="calculate()"></td><td class="subtotal" id="sub-50000">0 원</td></tr>
      <tr><td class="unit-name">10,000원</td><td><input type="number" min="0" class="qty nav-input" data-unit="10000" placeholder="0" oninput="calculate()"></td><td class="subtotal" id="sub-10000">0 원</td></tr>
      <tr><td class="unit-name">5,000원</td><td><input type="number" min="0" class="qty nav-input" data-unit="5000" placeholder="0" oninput="calculate()"></td><td class="subtotal" id="sub-5000">0 원</td></tr>
      <tr><td class="unit-name">1,000원</td><td><input type="number" min="0" class="qty nav-input" data-unit="1000" placeholder="0" oninput="calculate()"></td><td class="subtotal" id="sub-1000">0 원</td></tr>
      <tr><td class="unit-name">500원</td><td><input type="number" min="0" class="qty nav-input" data-unit="500" placeholder="0" oninput="calculate()"></td><td class="subtotal" id="sub-500">0 원</td></tr>
      <tr><td class="unit-name">100원</td><td><input type="number" min="0" class="qty nav-input" data-unit="100" placeholder="0" oninput="calculate()"></td><td class="subtotal" id="sub-100">0 원</td></tr>
      <tr><td class="unit-name">50원</td><td><input type="number" min="0" class="qty nav-input" data-unit="50" placeholder="0" oninput="calculate()"></td><td class="subtotal" id="sub-50">0 원</td></tr>
      <tr><td class="unit-name">10원</td><td><input type="number" min="0" class="qty nav-input" data-unit="10" placeholder="0" oninput="calculate()"></td><td class="subtotal" id="sub-10">0 원</td></tr>
      <tr class="total-row"><td colspan="2">총 합계 금액</td><td class="subtotal" id="total-amount">0 원</td></tr>
    </tbody>
  </table>

  <div class="extra-section">
    <div class="extra-row">
      <label for="today-cash">현금</label>
      <div class="input-wrap"><input type="text" id="today-cash" class="nav-input" placeholder="0" oninput="handleTodayCashInput(this)"><span>원</span></div>
    </div>
    <div class="extra-row">
      <label for="odd-change">끝전</label>
      <div class="input-wrap"><input type="text" id="odd-change" class="nav-input" placeholder="0" oninput="formatNumberInput(this)"><span>원</span></div>
    </div>
  </div>
</div>

<div class="modal-bg" id="staff-modal">
  <div class="modal-box">
    <h3 class="modal-title">담당자 명단 관리</h3>
    <div class="add-row">
      <input type="text" id="new-staff-input" placeholder="새 이름 입력">
      <button type="button" onclick="addNewStaff()">추가</button>
    </div>
    <div class="manage-list" id="manage-list"></div>
    <button type="button" class="modal-close" onclick="closeStaffModal()">닫기</button>
  </div>
</div>

<script>
  var STAFF_KEY = 'cafe_staff_list_final';

  function getStaffArray() {
    try {
      var saved = localStorage.getItem(STAFF_KEY);
      if (saved) { return JSON.parse(saved); }
    } catch (e) {}
    return '점장,매니저'.split(',');
  }

  function saveStaffArray(arr) {
    try { localStorage.setItem(STAFF_KEY, JSON.stringify(arr)); } catch (e) {}
  }

  function refreshStaffDropdown(keepValue) {
    var select = document.getElementById('manager');
    var currentVal = (keepValue !== undefined) ? keepValue : select.value;
    select.innerHTML = '';

    var defaultOpt = document.createElement('option');
    defaultOpt.value = '';
    defaultOpt.textContent = '선택';
    select.appendChild(defaultOpt);

    var list = getStaffArray();
    for (var i = 0; i < list.length; i++) {
      var name = list.at(i);
      if (name) {
        var opt = document.createElement('option');
        opt.value = name;
        opt.textContent = name;
        select.appendChild(opt);
      }
    }
    select.value = currentVal;
    if (select.selectedIndex === -1) { select.value = ''; }
  }

  function openStaffModal() {
    renderManageList();
    document.getElementById('staff-modal').style.display = 'flex';
    document.getElementById('new-staff-input').focus();
  }

  function closeStaffModal() {
    document.getElementById('staff-modal').style.display = 'none';
  }

  function renderManageList() {
    var container = document.getElementById('manage-list');
    container.innerHTML = '';
    var list = getStaffArray();

    if (list.length === 0) {
      container.innerHTML = '<div style="text-align:center; color:#888; padding:12px; font-size:14px;">등록된 담당자가 없습니다.</div>';
      return;
    }

    for (var i = 0; i < list.length; i++) {
      (function(name) {
        var row = document.createElement('div');
 row.className = 'manage-item';
var span = document.createElement('span');
span.textContent = name;
row.appendChild(span);
var btn = document.createElement('button');
btn.type = 'button';
btn.className = 'btn-del-item';
btn.textContent = '삭제';
btn.onclick = function() { removeStaff(name); };
row.appendChild(btn);
container.appendChild(row);
})(list.at(i));
}
}
function addNewStaff() {
var input = document.getElementById('new-staff-input');
var name = input.value.trim();
if (!name) return;
var list = getStaffArray();
if (list.indexOf(name) === -1) {
list.push(name);
saveStaffArray(list);
refreshStaffDropdown(name);
renderManageList();
} else {
alert('이미 등록된 이름입니다.');
}
input.value = '';
input.focus();
}
function removeStaff(targetName) {
var list = getStaffArray();
var nextList = ''.split(',').filter(Boolean);
for (var i = 0; i < list.length; i++) {
if (list.at(i) !== targetName) { nextList.push(list.at(i)); }
}
saveStaffArray(nextList);
refreshStaffDropdown();
renderManageList();
}
function setTodayDate() {
var now = new Date();
var year = now.getFullYear();
var month = ('0' + (now.getMonth() + 1)).slice(-2);
var date = ('0' + now.getDate()).slice(-2);
var dayName = '일월화수목금토'.charAt(now.getDay());
document.getElementById('current-date').textContent = year + '.' + month + '.' + date + ' (' + dayName + ')';
}
function calculate() {
var inputs = document.querySelectorAll('.qty');
var total = 0;
for (var i = 0; i < inputs.length; i++) {
var input = inputs.item(i);
var unit = parseInt(input.getAttribute('data-unit'), 10);
var count = parseInt(input.value, 10) || 0;
var subtotal = unit * count;
document.getElementById('sub-' + unit).textContent = subtotal.toLocaleString() + ' 원';
total += subtotal;
}
document.getElementById('total-amount').textContent = total.toLocaleString() + ' 원';
}
function handleTodayCashInput(el) {
var rawVal = el.value.replace(/[^0-9]/g, '');
var oddInput = document.getElementById('odd-change');
if (rawVal) {
var numVal = Number(rawVal);
el.value = numVal.toLocaleString();
oddInput.value = (numVal % 1000).toLocaleString();
} else {
el.value = '';
oddInput.value = '';
}
}
function formatNumberInput(el) {
var val = el.value.replace(/[^0-9]/g, '');
el.value = val ? Number(val).toLocaleString() : '';
}
function resetForm() {
if (confirm('입력한 내용을 모두 초기화할까요?')) {
document.getElementById('manager').value = '';
var inputs = document.querySelectorAll('.qty');
for (var i = 0; i < inputs.length; i++) { inputs.item(i).value = ''; }
document.getElementById('today-cash').value = '';
document.getElementById('odd-change').value = '';
calculate();
document.querySelector('.qty').focus();
}
}
function setupEnterNavigation() {
var navInputs = document.querySelectorAll('.nav-input');
for (var i = 0; i < navInputs.length; i++) {
(function(idx) {
navInputs.item(idx).addEventListener('keydown', function(e) {
if (e.key === 'Enter') {
e.preventDefault();
var next = navInputs.item(idx + 1);
if (next) {
next.focus();
if (next.select) { next.select(); }
}
}
});
})(i);
}
}
document.getElementById('new-staff-input').addEventListener('keydown', function(e) {
if (e.key === 'Enter') { e.preventDefault(); addNewStaff(); }
});
window.onload = function() {
setTodayDate();
refreshStaffDropdown('');
setupEnterNavigation();
};
</script>

</body>
</html>
