<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>카페 시재 마감현황판</title>
  <script>
    if (!window.opener && window.innerWidth > 720) {
      var popup = window.open(window.location.href, 'CafePOSWindowLarge', 'width=640,height=760,left=150,top=50,menubar=no,toolbar=no,location=no,status=no,resizable=yes');
      if (popup) { window.open('', '_self', ''); window.close(); }
    }
  </script>
  <style>
    * { box-sizing: border-box; font-family: 'Malgun Gothic', sans-serif; }
    html, body { margin: 0; padding: 0; background: #fff; }
    .container { width: 100%; max-width: 620px; margin: 0 auto; padding: 20px 24px; }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #333; padding-bottom: 12px; margin-bottom: 16px; }
    .header h1 { margin: 0; font-size: 22px; color: #222; }
    .btn-group button { padding: 7px 12px; font-size: 13px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; margin-left: 4px; }
    .btn-reset { background: #e9ecef; color: #333; }
    .btn-report { background: #217346; color: #fff; }
    .btn-save { background: #2b5876; color: #fff; }
    .info-box { display: flex; justify-content: space-between; background: #f8f9fa; padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; font-size: 16px; }
    .info-item { display: flex; align-items: center; gap: 8px; }
    .info-item label { font-weight: bold; color: #555; }
    .info-item input { border: none; border-bottom: 1.5px solid #aaa; background: transparent; font-size: 16px; padding: 3px 6px; width: 115px; outline: none; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 16px; }
    th, td { border: 1px solid #dee2e6; padding: 10px 12px; text-align: center; font-size: 17px; }
    th { background: #f1f3f5; color: #333; font-weight: bold; }
    td.unit-name { font-weight: bold; text-align: left; padding-left: 20px; }
    td input { width: 100px; padding: 6px 10px; font-size: 17px; text-align: right; border: 1px solid #ced4da; border-radius: 5px; }
    td.subtotal { text-align: right; padding-right: 20px; font-weight: 500; }
    tr.total-row { background: #eef4f8; font-weight: bold; font-size: 20px; }
    tr.total-row td { color: #1a365d; padding: 14px 12px; }
    .extra-section { border: 1px solid #dee2e6; border-radius: 8px; padding: 14px 20px; background: #fcfcfc; }
    .extra-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .extra-row:last-child { margin-bottom: 0; }
    .extra-row label { font-weight: bold; font-size: 18px; color: #333; }
    .input-wrap { display: flex; align-items: center; gap: 8px; font-size: 18px; }
    .input-wrap input { width: 170px; padding: 7px 10px; font-size: 18px; text-align: right; border: 1px solid #ced4da; border-radius: 5px; }
    /* 월간 정산 팝업 모달 */
    .modal-bg { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
    .modal-box { background: #fff; width: 92%; max-width: 540px; max-height: 85vh; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; }
    .modal-head { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd; padding-bottom: 10px; margin-bottom: 12px; }
    .modal-head h2 { margin: 0; font-size: 18px; }
    .modal-body { overflow-y: auto; flex: 1; }
    .modal-body table th, .modal-body table td { font-size: 14px; padding: 7px 8px; }
    .modal-foot { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #ddd; padding-top: 12px; margin-top: 10px; }
    .modal-foot select { padding: 6px; font-size: 14px; border-radius: 4px; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>☕ 카페 시재 마감현황판</h1>
    <div class="btn-group">
      <button type="button" class="btn-reset" onclick="resetForm()">초기화</button>
      <button type="button" class="btn-report" onclick="openMonthlyModal()">월간 정산</button>
      <button type="button" class="btn-save" onclick="saveDailyData()">저장</button>
    </div>
  </div>

  <div class="info-box">
    <div class="info-item">
      <label>마감 일자:</label>
      <span id="current-date" style="font-weight: bold; color: #222;"></span>
    </div>
    <div class="info-item">
      <label for="manager">담당자:</label>
      <input type="text" id="manager" class="nav-input" placeholder="이름 입력">
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th style="width: 34%;">권종</th>
        <th style="width: 30%;">수량 (장/개)</th>
        <th style="width: 36%;">금액</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="unit-name">50,000원</td><td><input type="number" min="0" class="qty nav-input" data-unit="50000" placeholder="0" oninput="calculate()"></td><td class="subtotal" id="sub-50000">0 원</td></tr>
      <tr><td class="unit-name">10,000원</td><td><input type="number" min="0" class="qty nav-input" data-unit="10000" placeholder="0" oninput="calculate()"></td><td class="subtotal" id="sub-10000">0 원</td></tr>
      <tr><td class="unit-name">5,000원</td><td><input type="number" min="0" class="qty nav-input" data-unit="5000" placeholder="0" oninput="calculate()"></td><td class="subtotal" id="sub-5000">0 원</td></tr>
      <tr><td class="unit-name">1,000원</td><td><input type="number" min="0" class="qty nav-input" data-unit="1000" placeholder="0" oninput="calculate()"></td><td class="subtotal" id="sub-1000">0 원</td></tr>
      <tr><td class="unit-name">500원</td><td><input type="number" min="0" class="qty nav-input" data-unit="500" placeholder="0" oninput="calculate()"></td><td class="subtotal" id="sub-500">0 원</td></tr>
      <tr><td class="unit-name">100원</td><td><input type="number" min="0" class="qty nav-input" data-unit="100" placeholder="0" oninput="calculate()"></td><td class="subtotal" id="sub-100">0 원</td></tr>
      <tr class="total-row"><td colspan="2">총 합계 금액</td><td class="subtotal" id="total-amount">0 원</td></tr>
    </tbody>
  </table>

  <div class="extra-section">
    <div class="extra-row">
      <label for="today-cash">오늘의 현금</label>
      <div class="input-wrap"><input type="text" id="today-cash" class="nav-input" placeholder="0" oninput="handleTodayCashInput(this)"><span>원</span></div>
    </div>
    <div class="extra-row">
      <label for="odd-change">끝전</label>
      <div class="input-wrap"><input type="text" id="odd-change" class="nav-input" placeholder="0" oninput="formatNumberInput(this)"><span>원</span></div>
    </div>
  </div>
</div>

<!-- 월간 현금/끝전 정산 모달 -->
<div class="modal-bg" id="monthly-modal">
  <div class="modal-box">
    <div class="modal-head">
      <h2>📊 월간 현금 · 끝전 내역</h2>
      <select id="month-selector" onchange="renderMonthlyTable()"></select>
    </div>
    <div class="modal-body">
      <table>
        <thead>
          <tr><th>날짜</th><th>담당자</th><th>오늘의 현금</th><th>끝전</th></tr>
        </thead>
        <tbody id="monthly-tbody"></tbody>
      </table>
    </div>
    <div class="modal-foot">
      <button type="button" class="btn-reset" onclick="closeMonthlyModal()">닫기</button>
      <button type="button" class="btn-report" onclick="exportMonthlyCSV()">엑셀(CSV) 내보내기</button>
    </div>
  </div>
</div>

<script>
  var STORAGE_KEY = 'cafe_closing_records_v1';

  function getTodayKey() {
    var now = new Date();
    return now.getFullYear() + '-' + ('0' + (now.getMonth() + 1)).slice(-2) + '-' + ('0' + now.getDate()).slice(-2);
  }

  function setTodayDate() {
    var now = new Date();
    var year = now.getFullYear();
    var month = ('0' + (now.getMonth() + 1)).slice(-2);
    var date = ('0' + now.getDate()).slice(-2);
    var dayName = '일월화수목금토'.charAt(now.getDay());
    document.getElementById('current-date').textContent = year + '.' + month + '.' + date + ' (' + dayName + ')';
  }

  function calculate() {
    var inputs = document.querySelectorAll('.qty');
    var total = 0;
    for (var i = 0; i < inputs.length; i++) {
      var input = inputs.item(i);
      var unit = parseInt(input.getAttribute('data-unit'), 10);
      var count = parseInt(input.value, 10) || 0;
      var subtotal = unit * count;
      document.getElementById('sub-' + unit).textContent = subtotal.toLocaleString() + ' 원';
      total += subtotal;
    }
    document.getElementById('total-amount').textContent = total.toLocaleString() + ' 원';
  }

  function handleTodayCashInput(el) {
    var rawVal = el.value.replace(/[^0-9]/g, '');
    var oddInput = document.getElementById('odd-change');
    if (rawVal) {
      var numVal = Number(rawVal);
      el.value = numVal.toLocaleString();
      oddInput.value = (numVal % 1000).toLocaleString();
    } else {
      el.value = '';
      oddInput.value = '';
    }
  }

  function formatNumberInput(el) {
    var val = el.value.replace(/[^0-9]/g, '');
    el.value = val ? Number(val).toLocaleString() : '';
  }

  function resetForm() {
    if (confirm('입력한 내용을 모두 초기화할까요?')) {
      document.getElementById('manager').value = '';
      var inputs = document.querySelectorAll('.qty');
      for (var i = 0; i < inputs.length; i++) { inputs.item(i).value = ''; }
      document.getElementById('today-cash').value = '';
      document.getElementById('odd-change').value = '';
      calculate();
      document.querySelector('.qty').focus();
    }
  }

  function setupEnterNavigation() {
    var navInputs = document.querySelectorAll('.nav-input');
    for (var i = 0; i < navInputs.length; i++) {
      (function(idx) {
        navInputs.item(idx).addEventListener('keydown', function(e) {
          if (e.key === 'Enter') {
            e.preventDefault();
            var next = navInputs.item(idx + 1);
            if (next) { next.focus(); next.select(); }
          }
        });
      })(i);
    }
  }

  // 1. 저장 버튼: 월간 장부에 현금/끝전 기록 + '25일.png' 사진 저장
  function saveDailyData() {
    var dateKey = getTodayKey();
    var manager = document.getElementById('manager').value.trim() || '-';
var cashNum = parseInt(document.getElementById('today-cash').value.replace(/[^0-9]/g, ''), 10) || 0;
var oddNum = parseInt(document.getElementById('odd-change').value.replace(/[^0-9]/g, ''), 10) || 0;
// 브라우저 로컬 저장소에 오늘 현금/끝전 기록
var records = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
records[dateKey] = { date: dateKey, manager: manager, cash: cashNum, odd: oddNum };
localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
// 사진 이미지 다운로드 ('25일.png')
downloadReceiptImage();
}
function downloadReceiptImage() {
var canvas = document.createElement('canvas');
var scale = 2, w = 600, h = 680;
canvas.width = w * scale; canvas.height = h * scale;
var ctx = canvas.getContext('2d');
ctx.scale(scale, scale);
ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h);
ctx.fillStyle = '#222222'; ctx.font = 'bold 24px "Malgun Gothic", sans-serif'; ctx.textAlign = 'left';
ctx.fillText('☕ 카페 시재 마감현황판', 28, 48);
ctx.strokeStyle = '#333333'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(28, 64); ctx.lineTo(w - 28, 64); ctx.stroke();
ctx.fillStyle = '#f8f9fa'; ctx.fillRect(28, 80, w - 56, 46);
var dateText = document.getElementById('current-date').textContent;
var managerText = document.getElementById('manager').value.trim() || '-';
ctx.fillStyle = '#555555'; ctx.font = 'bold 16px "Malgun Gothic", sans-serif';
ctx.fillText('마감 일자:', 44, 109); ctx.fillStyle = '#222222'; ctx.fillText(dateText, 125, 109);
ctx.fillStyle = '#555555'; ctx.fillText('담당자:', 370, 109); ctx.fillStyle = '#222222'; ctx.fillText(managerText, 435, 109);
var startY = 144, rowH = 46, x0 = 28, x1 = 215, x2 = 385, x3 = w - 28, tableW = x3 - x0;
ctx.fillStyle = '#f1f3f5'; ctx.fillRect(x0, startY, tableW, rowH);
ctx.strokeStyle = '#dee2e6'; ctx.lineWidth = 1; ctx.strokeRect(x0, startY, tableW, rowH);
ctx.beginPath(); ctx.moveTo(x1, startY); ctx.lineTo(x1, startY + rowH); ctx.moveTo(x2, startY); ctx.lineTo(x2, startY + rowH); ctx.stroke();
ctx.fillStyle = '#333333'; ctx.font = 'bold 17px "Malgun Gothic", sans-serif'; ctx.textAlign = 'center';
ctx.fillText('권종', (x0 + x1) / 2, startY + 29); ctx.fillText('수량 (장/개)', (x1 + x2) / 2, startY + 29); ctx.fillText('금액', (x2 + x3) / 2, startY + 29);
var qtyInputs = document.querySelectorAll('.qty');
for (var i = 0; i < qtyInputs.length; i++) {
var inputEl = qtyInputs.item(i);
var unit = parseInt(inputEl.getAttribute('data-unit'), 10);
var y = startY + rowH * (i + 1);
var count = parseInt(inputEl.value, 10) || 0;
var subtotal = unit * count;
ctx.fillStyle = '#ffffff'; ctx.fillRect(x0, y, tableW, rowH); ctx.strokeRect(x0, y, tableW, rowH);
ctx.beginPath(); ctx.moveTo(x1, y); ctx.lineTo(x1, y + rowH); ctx.moveTo(x2, y); ctx.lineTo(x2, y + rowH); ctx.stroke();
ctx.fillStyle = '#222222'; ctx.font = 'bold 17px "Malgun Gothic", sans-serif'; ctx.textAlign = 'left';
ctx.fillText(unit.toLocaleString() + '원', x0 + 20, y + 29);
ctx.font = '17px "Malgun Gothic", sans-serif'; ctx.textAlign = 'center';
ctx.fillText(count.toLocaleString(), (x1 + x2) / 2, y + 29);
ctx.textAlign = 'right'; ctx.fillText(subtotal.toLocaleString() + ' 원', x3 - 20, y + 29);
}
var totalY = startY + rowH * 7, totalH = 54;
ctx.fillStyle = '#eef4f8'; ctx.fillRect(x0, totalY, tableW, totalH); ctx.strokeRect(x0, totalY, tableW, totalH);
ctx.beginPath(); ctx.moveTo(x2, totalY); ctx.lineTo(x2, totalY + totalH); ctx.stroke();
ctx.fillStyle = '#1a365d'; ctx.font = 'bold 20px "Malgun Gothic", sans-serif'; ctx.textAlign = 'center';
ctx.fillText('총 합계 금액', (x0 + x2) / 2, totalY + 34);
ctx.textAlign = 'right'; ctx.fillText(document.getElementById('total-amount').textContent, x3 - 20, totalY + 34);
var extraY = totalY + totalH + 18, extraH = 104;
ctx.fillStyle = '#fcfcfc'; ctx.fillRect(x0, extraY, tableW, extraH); ctx.strokeStyle = '#dee2e6'; ctx.strokeRect(x0, extraY, tableW, extraH);
var todayCashVal = document.getElementById('today-cash').value || '0';
var oddChangeVal = document.getElementById('odd-change').value || '0';
ctx.fillStyle = '#333333'; ctx.font = 'bold 18px "Malgun Gothic", sans-serif'; ctx.textAlign = 'left';
ctx.fillText('오늘의 현금', x0 + 22, extraY + 38); ctx.fillText('끝전', x0 + 22, extraY + 82);
ctx.textAlign = 'right'; ctx.fillText(todayCashVal + ' 원', x3 - 22, extraY + 38); ctx.fillText(oddChangeVal + ' 원', x3 - 22, extraY + 82);
var link = document.createElement('a');
link.download = (new Date()).getDate() + '일.png';
link.href = canvas.toDataURL('image/png');
document.body.appendChild(link); link.click(); document.body.removeChild(link);
}
// 2. 월간 정산 모달 열기
function openMonthlyModal() {
var records = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
var keys = Object.keys(records).sort();
var selector = document.getElementById('month-selector');
selector.innerHTML = '';
var currentYM = getTodayKey().slice(0, 7);
var monthsMap = {};
monthsMap[currentYM] = true;
for (var i = 0; i < keys.length; i++) {
monthsMap[keys.item ? keys.item(i).slice(0, 7) : keys.slice(0, 7)] = true;
}
var monthList = Object.keys(monthsMap).sort().reverse();
for (var j = 0; j < monthList.length; j++) {
var ym = monthList.at(j);
var opt = document.createElement('option');
opt.value = ym;
opt.textContent = ym.replace('-', '년 ') + '월';
selector.appendChild(opt);
}
renderMonthlyTable();
document.getElementById('monthly-modal').style.display = 'flex';
}
function closeMonthlyModal() {
document.getElementById('monthly-modal').style.display = 'none';
}
function renderMonthlyTable() {
var selectedYM = document.getElementById('month-selector').value;
var records = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
var keys = Object.keys(records).sort();
var tbody = document.getElementById('monthly-tbody');
tbody.innerHTML = '';
var sumCash = 0, sumOdd = 0, count = 0;
for (var i = 0; i < keys.length; i++) {
var k = keys.at(i);
if (k.indexOf(selectedYM) === 0) {
var r = records[k];
sumCash += r.cash;
sumOdd += r.odd;
count++;
var tr = document.createElement('tr');
tr.innerHTML = '' + r.date + '' + r.manager + '' + r.cash.toLocaleString() + '원' + r.odd.toLocaleString() + '원';
tbody.appendChild(tr);
}
}
if (count === 0) {
tbody.innerHTML = '저장된 마감 내역이 없습니다.';
} else {
var totalTr = document.createElement('tr');
totalTr.style.background = '#eef4f8';
totalTr.style.fontWeight = 'bold';
totalTr.innerHTML = '월간 총 합계 (' + count + '일)' + sumCash.toLocaleString() + '원' + sumOdd.toLocaleString() + '원';
tbody.appendChild(totalTr);
}
}
// 3. 선택한 달의 현금/끝전만 엑셀(CSV)로 추출
function exportMonthlyCSV() {
var selectedYM = document.getElementById('month-selector').value;
var records = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
var keys = Object.keys(records).sort();
var csv = '\uFEFF날짜,담당자,오늘의 현금,끝전\n';
var sumCash = 0, sumOdd = 0;
for (var i = 0; i < keys.length; i++) {
var k = keys.at(i);
if (k.indexOf(selectedYM) === 0) {
var r = records[k];
sumCash += r.cash;
sumOdd += r.odd;
csv += r.date + ',' + r.manager + ',' + r.cash + ',' + r.odd + '\n';
}
}
csv += '월간 총 합계,-,' + sumCash + ',' + sumOdd + '\n';
var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
var link = document.createElement('a');
link.download = selectedYM.replace('-', '년_') + '월_현금끝전정산.csv';
link.href = URL.createObjectURL(blob);
document.body.appendChild(link); link.click(); document.body.removeChild(link);
}
window.onload = function() {
setTodayDate();
setupEnterNavigation();
};
</script>

</body>
</html>
