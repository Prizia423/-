<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>카페 시재 마감현황판</title>
  <script>
    // 일반 넓은 탭에서 열렸을 경우 -> 작은 미니 창 1개만 띄우고, 방금 열린 넓은 임시 탭만 닫기
    if (!window.opener && window.innerWidth > 550) {
      const popup = window.open(
        window.location.href,
        'CafePOSWindow',
        'width=480,height=560,left=200,top=100,menubar=no,toolbar=no,location=no,status=no,resizable=yes'
      );
      if (popup) {
        window.open('', '_self', '');
        window.close();
      }
    }
  </script>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    }
    html, body {
      margin: 0;
      padding: 0;
      background-color: #ffffff;
    }
    .container {
      width: 100%;
      max-width: 460px;
      margin: 0 auto;
      padding: 14px 16px;
      background: #ffffff;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #333;
      padding-bottom: 8px;
      margin-bottom: 10px;
    }
    .header h1 {
      margin: 0;
      font-size: 18px;
      color: #222;
    }
    .btn-group button {
      padding: 4px 9px;
      font-size: 12px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-left: 4px;
    }
    .btn-reset {
      background-color: #e9ecef;
      color: #333;
    }
    .btn-print {
      background-color: #2b5876;
      color: #fff;
    }
    .info-box {
      display: flex;
      justify-content: space-between;
      background-color: #f8f9fa;
      padding: 8px 10px;
      border-radius: 6px;
      margin-bottom: 10px;
      font-size: 13px;
    }
    .info-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .info-item label {
      font-weight: bold;
      color: #555;
    }
    .info-item input {
      border: none;
      border-bottom: 1px solid #aaa;
      background: transparent;
      font-size: 13px;
      padding: 2px 4px;
      width: 85px;
      outline: none;
    }
    .info-item input:focus {
      border-bottom: 2px solid #2b5876;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 10px;
    }
    th, td {
      border: 1px solid #dee2e6;
      padding: 6px 8px;
      text-align: center;
      font-size: 14px;
    }
    th {
      background-color: #f1f3f5;
      color: #333;
      font-weight: bold;
    }
    td.unit-name {
      font-weight: bold;
      text-align: left;
      padding-left: 14px;
    }
    td input[type="number"] {
      width: 75px;
      padding: 4px 6px;
      font-size: 14px;
      text-align: right;
      border: 1px solid #ced4da;
      border-radius: 4px;
    }
    td.subtotal {
      text-align: right;
      padding-right: 14px;
      font-weight: 500;
    }
    tr.total-row {
      background-color: #eef4f8;
      font-weight: bold;
      font-size: 15px;
    }
    tr.total-row td {
      color: #1a365d;
      padding: 9px 8px;
    }
    .extra-section {
      border: 1px solid #dee2e6;
      border-radius: 6px;
      padding: 10px 14px;
      background-color: #fcfcfc;
    }
    .extra-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .extra-row:last-child {
      margin-bottom: 0;
    }
    .extra-row label {
      font-weight: bold;
      font-size: 14px;
      color: #333;
    }
    .input-wrap {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 14px;
    }
    .input-wrap input {
      width: 130px;
      padding: 5px 8px;
      font-size: 14px;
      text-align: right;
      border: 1px solid #ced4da;
      border-radius: 4px;
    }

    @media print {
      .btn-group {
        display: none;
      }
      input {
        border: none !important;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>☕ 카페 시재 마감현황판</h1>
    <div class="btn-group">
      <button class="btn-reset" onclick="resetForm()">초기화</button>
    </div>
  </div>

  <div class="info-box">
    <div class="info-item">
      <label>마감 일자:</label>
      <span id="current-date" style="font-weight: bold; color: #222;"></span>
    </div>
    <div class="info-item">
      <label for="manager">담당자:</label>
      <input type="text" id="manager" class="nav-input" placeholder="이름 입력">
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th style="width: 34%;">권종</th>
        <th style="width: 30%;">수량 (장/개)</th>
        <th style="width: 36%;">금액</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td class="unit-name">50,000원</td>
        <td><input type="number" min="0" class="qty nav-input" data-unit="50000" placeholder="0" oninput="calculate()"></td>
        <td class="subtotal" id="sub-50000">0 원</td>
      </tr>
      <tr>
        <td class="unit-name">10,000원</td>
        <td><input type="number" min="0" class="qty nav-input" data-unit="10000" placeholder="0" oninput="calculate()"></td>
        <td class="subtotal" id="sub-10000">0 원</td>
      </tr>
      <tr>
        <td class="unit-name">5,000원</td>
        <td><input type="number" min="0" class="qty nav-input" data-unit="5000" placeholder="0" oninput="calculate()"></td>
        <td class="subtotal" id="sub-5000">0 원</td>
      </tr>
      <tr>
        <td class="unit-name">1,000원</td>
        <td><input type="number" min="0" class="qty nav-input" data-unit="1000" placeholder="0" oninput="calculate()"></td>
        <td class="subtotal" id="sub-1000">0 원</td>
      </tr>
      <tr>
        <td class="unit-name">500원</td>
        <td><input type="number" min="0" class="qty nav-input" data-unit="500" placeholder="0" oninput="calculate()"></td>
        <td class="subtotal" id="sub-500">0 원</td>
      </tr>
      <tr>
        <td class="unit-name">100원</td>
        <td><input type="number" min="0" class="qty nav-input" data-unit="100" placeholder="0" oninput="calculate()"></td>
        <td class="subtotal" id="sub-100">0 원</td>
      </tr>
      <tr class="total-row">
        <td colspan="2">총 합계 금액</td>
        <td class="subtotal" id="total-amount">0 원</td>
      </tr>
    </tbody>
  </table>

  <div class="extra-section">
    <div class="extra-row">
      <label for="today-cash">현금</label>
      <div class="input-wrap">
        <input type="text" id="today-cash" class="nav-input" placeholder="0" oninput="handleTodayCashInput(this)">
        <span>원</span>
      </div>
    </div>
    <div class="extra-row">
      <label for="odd-change">끝전</label>
      <div class="input-wrap">
        <input type="text" id="odd-change" class="nav-input" placeholder="0" oninput="formatNumberInput(this)">
        <span>원</span>
      </div>
    </div>
  </div>
</div>

<script>
  function setTodayDate() {
    const now = new Date();
    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, '0');
    const date = String(now.getDate()).padStart(2, '0');
    const days = ['일', '월', '화', '수', '목', '금', '토'];
    const dayName = days[now.getDay()];

    document.getElementById('current-date').textContent = `${year}.${month}.${date} (${dayName})`;
  }

  function calculate() {
    const inputs = document.querySelectorAll('.qty');
    let total = 0;

    inputs.forEach(input => {
      const unit = parseInt(input.getAttribute('data-unit'));
      const count = parseInt(input.value) || 0;
      const subtotal = unit * count;
      
      document.getElementById(`sub-${unit}`).textContent = subtotal.toLocaleString() + ' 원';
      total += subtotal;
    });

    document.getElementById('total-amount').textContent = total.toLocaleString() + ' 원';
  }

  function handleTodayCashInput(el) {
    let rawVal = el.value.replace(/[^0-9]/g, '');
    const oddChangeInput = document.getElementById('odd-change');

    if (rawVal) {
      const numVal = Number(rawVal);
      el.value = numVal.toLocaleString();
      
      const oddChange = numVal % 1000;
      oddChangeInput.value = oddChange.toLocaleString();
    } else {
      el.value = '';
      oddChangeInput.value = '';
    }
  }

  function formatNumberInput(el) {
    let val = el.value.replace(/[^0-9]/g, '');
    if (val) {
      el.value = Number(val).toLocaleString();
    } else {
      el.value = '';
    }
  }

  function resetForm() {
    if (confirm('입력한 내용을 모두 초기화할까요?')) {
      document.getElementById('manager').value = '';
      document.querySelectorAll('.qty').forEach(input => input.value = '');
      document.getElementById('today-cash').value = '';
      document.getElementById('odd-change').value = '';
      calculate();
      document.querySelector('.qty').focus();
    }
  }

  function setupEnterNavigation() {
    const navInputs = Array.from(document.querySelectorAll('.nav-input'));
    
    navInputs.forEach((input, index) => {
      input.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          const nextInput = navInputs[index + 1];
          if (nextInput) {
            nextInput.focus();
            nextInput.select();
          }
        }
      });
    });
  }

  window.onload = function() {
    setTodayDate();
    setupEnterNavigation();
  };
</script>

</body>
</html>
